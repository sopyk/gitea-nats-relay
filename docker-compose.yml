# Webhook2NATS — 使用预构建镜像
#
# 本文件不含任何环境值，可以安全地进版本库。真实值放在两个被忽略的文件里：
#   ./relay.env        密钥（NATS_PASSWORD / WEBHOOK_SECRET），由本仓库 .gitignore 排除
#   ./config/          身份映射与配置，其中只有 members.json 需要你自己填
#
# 用法：
#   docker compose pull          # 拉取镜像
#   docker compose up -d
#   curl -s localhost:8090/healthz      # → ok
#
# 想从源码构建，请改用 docker-compose.build.yml。
# 两份文件请保持同步，差异仅限镜像来源。
#
# ── 镜像 tag 怎么选 ─────────────────────────────────────────
# 默认用 :latest —— 它只跟**正式版**走，预发布（rc/beta/alpha）不会移动它，
# 所以 docker compose pull 拿到的永远是已发布的稳定版，不会是测试版。
# CI 里有一条断言在强制这条规则（见 .github/workflows/publish.yml）：
# 预发布若产出 latest，构建当场失败。
#
# 它仍是移动指针：**同一个名字不保证永远是同一个镜像**。要可复现、可回滚
# 就钉小版本：
#   image: ghcr.io/sopyk/webhook2nats:1.0
# 取舍见 docs/operations.md「镜像 tag 的选择与风险」。
#
# ⚠️ 单实例约束（硬约束，不是建议）
#
# seen.json（去重状态）是**每个实例本地**的。一份部署只允许配一个 webhook
# 回调地址。若把同一个回调指向多个实例，同一个 delivery 会在每个实例上各
# 处理一次 —— 门铃重复下发，而且**每一侧都记 accepted、没有任何报错**，
# 从日志上看不出异常。
#
# 需要多实例时，先把去重换成共享后端（JetStream / KV / Redis），
# 别直接照着本文件起第二份。

services:
  webhook2nats:
    # 主推 GitHub Container Registry；如同时推到 Docker Hub 可换成：
    #   image: sopyk/webhook2nats:latest
    image: ghcr.io/sopyk/webhook2nats:latest

    container_name: webhook2nats
    restart: unless-stopped

    ports:
      - "8090:8090"

    volumes:
      # 配置目录：只读。容器改不了 members.json，也就改不了门铃去向。
      - ./config:/config:ro
      # 去重状态：需要可写。与配置目录物理分开，便于备份/重建。
      - ./data:/data

    # 密钥走这里，不走 volumes —— Docker 在宿主侧读取后注入为环境变量，
    # 该文件不会进入容器的文件系统。详见 README「安全说明」。
    env_file:
      - ./relay.env

    environment:
      # 刻意**不**在这里设 MEMBERS_FILE / DEDUP_FILE —— 代码默认值就是这两个路径，
      # 而环境变量优先级高于配置文件，在这里重复一遍只会静默盖掉
      # config/webhook2nats.toml 里的设置，且没有任何提示。
      # 需要改路径请改配置文件；只有「想覆盖配置文件」时才用环境变量。
      TZ: "Asia/Shanghai"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # 这台服务只需要「读 body + 出网连 NATS」，不需要任何特权。
    # 监听 8090 是高位端口，去掉 NET_BIND_SERVICE 也能正常启动。
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # 更硬的选项（默认关闭）：除了 /data 没有任何理由写盘。
    # 配合上面的 PYTHONDONTWRITEBYTECODE 可避免写 .pyc 失败。
    # read_only: true
    # tmpfs:
    #   - /tmp