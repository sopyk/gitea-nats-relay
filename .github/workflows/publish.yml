# 构建并发布多架构镜像到 GHCR。
#
# 为什么在这里构建而不是本地：本地是 arm64，推不出 amd64；
# GitHub Actions 自带 QEMU，能一次产出 linux/amd64 + linux/arm64。
#
# 触发方式：
#   workflow_dispatch  手动（可填 tag）
#   push tag v*        打 v 开头的 tag 时自动发布
#
# 前置条件：仓库 Settings → Actions → General → Workflow permissions
# 需设为 "Read and write permissions"，否则 GITHUB_TOKEN 推不了包。
name: publish-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像 tag（留空则自动用分支名/短 sha）"
        required: false
        type: string
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Docker Hub 的目标仓库。与 GHCR 同一个镜像，推两份。
  DOCKERHUB_IMAGE: sopyk/webhook2nats

jobs:
  build:
    name: build & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # 推 GHCR 必需
    steps:
      - uses: actions/checkout@v4

      # 自带 runner 的 buildx 只支持 runner 自身架构，
      # 不装 QEMU 就无法交叉构建另一个架构。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 决定这次推到哪些 registry。
      #
      # GHCR 总是推（分支构建也要，方便测试）。Docker Hub **只推稳定版
      # git tag** —— 三个理由：
      #   1. DockerHub 上第一个镜像要是干净的正式版，不是 `main` 之类的分支 tag
      #   2. 分支/RC 构建频率高，DockerHub 上会堆一串没人要的 tag
      #   3. 少一个凭据暴露面：分支构建（可能是别人的 PR）不需要 DockerHub 凭据
      - name: Decide target registries
        id: targets
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          DH_IMAGE: ${{ env.DOCKERHUB_IMAGE }}
        run: |
          set -euo pipefail
          images="${REGISTRY}/${IMAGE_NAME}"
          dh="false"

          case "$EVENT/$REF" in
            push/refs/tags/v*)
              # 预发布 git tag（-rc / -beta / -alpha）也不推 DockerHub：
              # 和「latest 只跟正式版走」是同一条策略。
              case "$REF" in
                *-rc*|*-beta*|*-alpha*)
                  echo "预发布 git tag：只推 GHCR，不进 Docker Hub" ;;
                *)
                  dh="true"
                  images="${images}"$'\n'"docker.io/${DH_IMAGE}"
                  echo "稳定版 git tag：GHCR + Docker Hub" ;;
              esac ;;
            *)
              echo "非稳定版 tag 推送：只推 GHCR，不进 Docker Hub" ;;
          esac

          {
            echo "images<<EOF"
            echo "$images"
            echo "EOF"
            echo "dockerhub=$dh"
          } >> "$GITHUB_OUTPUT"
          echo "目标 registry（$dh 含 Docker Hub）："
          echo "$images" | sed 's/^/  /'

      # Docker Hub 只在需要时登录。放在条件分支里而不是无条件登录：
      # secrets 缺失时登录会失败，而分支构建压根不需要用到这个凭据。
      #
      # 先显式校验 secret 非空。不加这段的话，secret 名字对不上（比如填成了
      # DOCKER_HUB_TOKEN）只会得到一个「unauthorized」的含糊报错，
      # 对着 DockerHub 官网查半天也查不出是 GitHub 侧名字写错。
      - name: Check Docker Hub secrets
        if: steps.targets.outputs.dockerhub == 'true'
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$DH_USER" ] || missing+=("DOCKERHUB_USERNAME")
          [ -n "$DH_TOKEN" ] || missing+=("DOCKERHUB_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::缺少 secret: ${missing[*]} —— 到仓库 Settings → "\
          "Secrets and variables → Actions → New repository secret 添加它。"\
          "Docker Hub 的 PAT 在 Account Settings → Security → New Access Token，"\
          "权限只勾 Read & Write。"
            exit 1
          fi
          echo "Docker Hub 凭据齐全（用户名 $DH_USER）"

      - name: Log in to Docker Hub
        if: steps.targets.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.targets.outputs.images }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }}
            type=sha,format=short

      # /version 要报的两个值都从仓库里读，不在别处硬编码 ——
      # 「版本号出现在多处、有的改了有的没改」是最常见的发版事故。
      - name: Read version
        id: ver
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./relay
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # tag 策略断言：把「latest 只跟正式版走」从文档里的说法
      # 变成构建当场就验的不变量。
      #
      # 为什么要专门加这一步：metadata-action 的 latest=auto，官方文档明确
      # 写了预发布（rc/beta/alpha）不产出 latest。但同一篇文档的「Latest tag」
      # 一节又把 type=ref,event=tag 列进 latest 的适用范围，而我们的规则里
      # 正好有这一条 —— 文档在这两点上并不完全自洽。与其赌默认行为不会变，
      # 不如直接断言。
      #
      # 赌输的后果很具体：哪天有人推了预发布 git tag，latest 被移动，
      # 别人 docker compose pull 拿到没测过的镜像，且全程无任何报错。
      - name: Assert tag policy
        env:
          REF: ${{ github.ref }}
          META_JSON: ${{ steps.meta.outputs.json }}
          DH_WANTED: ${{ steps.targets.outputs.dockerhub }}
        run: |
          set -euo pipefail
          # json['tags'] 里是**完整镜像引用**（ghcr.io/...:latest），
          # 直接拿去和 'latest' 比永远不相等 —— 那会让断言每次都报
          # 「缺 latest」，把每一次正式发布都卡死。只取最后一段。
          #
          # 推两个 registry 时，tags 列表里每个逻辑 tag 出现两次
          # （ghcr.io/...:1.0.0 和 docker.io/...:1.0.0），所以这里按
          # 「registry 路径 → tag 集合」分组判断，而不是拍平成一张大表。
          python3 - <<'PY'
          import json, os, sys

          ref = os.environ["REF"]
          meta = json.loads(os.environ["META_JSON"])
          dh_wanted = os.environ["DH_WANTED"] == "true"

          by_reg = {}
          for full in meta["tags"]:
              path, _, tag = full.rpartition(":")
              by_reg.setdefault(path, set()).add(tag)

          print("按 registry 分组的 tag：")
          for path in sorted(by_reg):
              print(f"  {path}: {sorted(by_reg[path])}")

          is_prerelease = any(f"-{p}" in ref for p in ("rc", "beta", "alpha"))

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          # 1) 预发布不许动 latest（任何 registry 都不行）。
          #    **只在预发布时判** —— 稳定版本来就该带 latest，少了这个
          #    门槛会把每一次正式版发布都判成失败。
          if is_prerelease:
              for path, tags in by_reg.items():
                  if "latest" in tags:
                      fail(f"{path} 带了 latest —— 预发布版本不允许移动 latest，"
                           f"否则别人 pull 到的是未测试镜像")

          # 2) 稳定版 git tag 的**每个**目标 registry 都必须带 latest
          if ref.startswith("refs/tags/") and not is_prerelease:
              for path, tags in by_reg.items():
                  if not {"latest"} <= tags:
                      fail(f"{path} 缺 latest（实际 {sorted(tags)}）")

          # 3) 两个 registry 的 tag 集合必须一致。
          #    不一致意味着有一侧漏推或多推 —— 最常见的成因是
          #    metadata-action 的 images 列表拼错，只加了一个 registry。
          if dh_wanted:
              paths = sorted(by_reg)
              if len(paths) < 2:
                  fail(f"Docker Hub 被标记为目标，但 tags 里只有 {paths}，"
                       f"images 列表拼错了？")
              first = by_reg[paths[0]]
              for path in paths[1:]:
                  if by_reg[path] != first:
                      fail(f"{path} 的 tag 集合与 {paths[0]} 不一致："
                           f"{sorted(by_reg[path])} vs {sorted(first)}")

          print("tag 策略校验通过"
                f"（预发布={is_prerelease} DockerHub={dh_wanted}）")
          PY

      # QEMU 交叉构建偶尔会静默跳过某个架构（本地能验的就在 CI 里也验）。
      # 用 buildx 自带的 imagetools 读远端 manifest —— 它已经处理了
      # token、Accept 头、多架构 index 这些细节，手写 curl 容易出错
      # （前两版就栽在 tags 是 list 不是 dict、以及多行 JSON 被 YAML 折行上）。
      #
      # **逐 registry 验，Docker Hub 也验**。那是「别人 pull 下来的镜像
      # 能不能在自己机器上跑起来」的唯一证据 —— 本地是 arm64，验证不了
      # amd64 有没有漏，只能靠这里读远端 manifest。
      - name: Verify both architectures landed
        env:
          TAGS_JSON: ${{ steps.meta.outputs.json }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          # metadata-action 的 json 输出里 tags 是 list[str]，不是 dict。
          # 推两个 registry 时每条 tag 出现两次，这里先去重出 registry 路径。
          repos=$(echo "$TAGS_JSON" | python3 -c "
          import json,sys
          seen=[]
          for full in json.load(sys.stdin)['tags']:
              path=full.rpartition(':')[0]
              if path not in seen: seen.append(path)
          print('\n'.join(seen))")
          echo "要验证的 registry 仓库："; echo "$repos" | sed 's/^/  /'

          while IFS= read -r path; do
              [ -n "$path" ] || continue
              case "$path" in
                  ghcr.io/*)   reg="ghcr.io";   name="${path#ghcr.io/}" ;;
                  docker.io/*) reg="docker.io"; name="${path#docker.io/}" ;;
                  *) echo "::warning::不认识的 registry $path，跳过"; continue ;;
              esac

              # 两个 registry 的匿名 token 端点格式不一样：
              #   GHCR  → https://ghcr.io/token?scope=repository:owner/repo:pull
              #   Docker → https://auth.docker.io/token?service=registry.docker.io&scope=...
              if [ "$reg" = "ghcr.io" ]; then
                  token_url="https://ghcr.io/token?scope=repository:${name}:pull&service=ghcr.io"
              else
                  token_url="https://auth.docker.io/token?service=registry.docker.io&scope=repository:${name}:pull"
              fi
              token=$(curl -sSf "$token_url" \
                  | python3 -c "import sys,json;print(json.load(sys.stdin)['token'])")

              echo "── $path"
              curl -sSf -H "Authorization: Bearer ${token}" \
                  -H 'Accept: application/vnd.oci.image.index.v1+json' \
                  -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
                  "https://${reg}/v2/${name}/manifests/latest" > /tmp/m.json
              python3 -c "
          import json,sys
          d = json.load(open('/tmp/m.json'))
          plats = sorted({m['platform']['os']+'/'+m['platform']['architecture']
                          for m in d.get('manifests', []) if 'platform' in m})
          print('manifest 平台:', plats)
          missing = {'linux/amd64','linux/arm64'} - set(plats)
          if missing:
              sys.exit('缺少架构: %s —— QEMU 可能静默跳过了' % sorted(missing))
          print('✓ 双架构确认')"
          done <<< "$repos"